<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tietgen Rådgiver Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .projects {
            display: grid;
            gap: 20px;
        }

        .project-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .project-card h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .project-card p {
            font-size: 14px;
            opacity: 0.9;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            .project-card h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎯 Tietgen Rådgiver Platform</h1>
        <p class="subtitle">Velkommen til dine projekter og værktøjer</p>

        <div class="projects">
            <a href="todo-list.html" class="project-card">
                <div class="icon">📝</div>
                <h2>To-Do Liste</h2>
                <p>Administrer dine opgaver med lokal lagring</p>
            </a>

            <a href="flyt-pension.html" class="project-card">
                <div class="icon">💼</div>
                <h2>Flyt Pension Beregner</h2>
                <p>Beregn og analyse din pensionsflytning</p>
            </a>
        </div>
    </div>

</body>
</html>
