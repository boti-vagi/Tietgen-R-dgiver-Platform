<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tietgen Academy — Rådgiveruddannelse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2307A0C3'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>T</text></svg>">
</head>
<body>

<!-- ══════════════ LOGIN GATE ══════════════ -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-logo">T</div>
    <h1>Tietgen <span>Academy</span></h1>
    <p class="gate-sub">Onboarding & træning for Tietgen Pension-rådgivere</p>
    <form id="gateForm">
      <input type="password" id="gateInput" placeholder="Adgangskode" autocomplete="current-password" autofocus>
      <button type="submit">Log ind</button>
      <p id="gateError" class="gate-error" hidden>Forkert adgangskode — prøv igen.</p>
    </form>
    <p class="gate-foot">www.tietgenpension.dk</p>
  </div>
</div>

<!-- ══════════════ APP ══════════════ -->
<div id="app" hidden>

  <header class="topbar">
    <button id="menuBtn" class="menu-btn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <a href="#/hjem" class="brand">
      <span class="brand-logo">T</span>
      <span class="brand-name">Tietgen <b>Academy</b></span>
    </a>
    <div class="topbar-right">
      <div class="progress-pill" id="topProgress" title="Din samlede fremdrift">0%</div>
    </div>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar">
      <div class="nav-group">
        <a class="nav-link" href="#/hjem" data-nav="hjem">🏠 Overblik</a>
        <a class="nav-link" href="#/onboarding" data-nav="onboarding">🚀 Kom godt i gang</a>
      </div>
      <div class="nav-group">
        <div class="nav-title">Playbook</div>
        <div id="navPlaybook"></div>
      </div>
      <div class="nav-group">
        <div class="nav-title">Platforme</div>
        <a class="nav-link" href="#/apex" data-nav="apex">📈 Tietgen Apex</a>
      </div>
      <div class="nav-group">
        <div class="nav-title">Træning</div>
        <a class="nav-link" href="#/traening" data-nav="traening">🎓 Quizzer & fremdrift</a>
      </div>
      <div class="nav-foot">
        <button id="resetBtn" class="link-btn">Nulstil min fremdrift</button>
        <button id="logoutBtn" class="link-btn">Log ud</button>
      </div>
    </nav>
    <div id="scrim" class="scrim"></div>

    <main id="main" class="main"></main>
  </div>
</div>

<script src="data/playbook.js"></script>
<script src="data/apex.js"></script>
<script src="data/quizzes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
